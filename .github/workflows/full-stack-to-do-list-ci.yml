name: Full-Stack-To-Do-List CI Validation

on:
  push:
    branches:
      - 'automation/**'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Run test job only (Stage 3 mode)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  # ── Gate 1: Code Style & Quality ────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_only != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ESLint
        run: |
          if [ -d "frontend/toDoList-Frontend" ]; then
            cd frontend/toDoList-Frontend
            npm install --legacy-peer-deps || true
            npx eslint . --max-warnings=50 || true
            cd ../..
          elif [ -f "package.json" ]; then
            npm install --legacy-peer-deps || true
            npx eslint . --max-warnings=50 || true
          else
            echo "No ESLint configuration found, skipping."
          fi

  # ── Gate 2: Static Application Security Testing (SAST) ───────────────
  security-sast:
    name: security-sast
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_only != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_RULES: p/javascript p/typescript

  # ── Gate 3: Software Composition Analysis (SCA / Dependencies) ──────
  security-deps:
    name: security-deps
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_only != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

  # ── Gate 4: Test Suite Execution & Coverage ─────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Execute Target Tests
        run: |
          echo "=== Locating Tests in Target Repository ==="
          find . -name "*.test.*" -o -name "*.spec.*" | grep -v node_modules || true

          if [ -d "frontend/toDoList-Frontend" ]; then
            echo "Running tests in frontend/toDoList-Frontend..."
            cd frontend/toDoList-Frontend
            npm install --legacy-peer-deps || true
            npm install --save-dev vitest jsdom @testing-library/react @testing-library/dom @testing-library/jest-dom @testing-library/user-event @vitejs/plugin-react --legacy-peer-deps || true
            echo "import '@testing-library/jest-dom';" > vitest.setup.js
            cat << 'EOF' > vitest.config.js
import { defineConfig } from 'vitest/config';
import react from '@vitejs/plugin-react';

export default defineConfig({
  plugins: [react()],
  test: {
    globals: true,
    environment: 'jsdom',
    setupFiles: ['./vitest.setup.js'],
  },
});
EOF
            npx vitest run
            cd ../..
          elif [ -f "package.json" ]; then
            echo "Running tests in root directory..."
            npm install --legacy-peer-deps || true
            npm install --save-dev vitest jsdom @testing-library/react @testing-library/dom @testing-library/jest-dom @testing-library/user-event @vitejs/plugin-react --legacy-peer-deps || true
            echo "import '@testing-library/jest-dom';" > vitest.setup.js
            cat << 'EOF' > vitest.config.js
import { defineConfig } from 'vitest/config';
import react from '@vitejs/plugin-react';

export default defineConfig({
  plugins: [react()],
  test: {
    globals: true,
    environment: 'jsdom',
    setupFiles: ['./vitest.setup.js'],
  },
});
EOF
            npx vitest run || npm test
          else
            echo "No package.json found."
            exit 1
          fi
        env:
          CI: true

  # ── Gate 5: SonarQube / SonarCloud Quality Gate ──────────────────────
  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_only != 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Quality Gate Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
